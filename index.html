<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITHÉLICE v1.1 — Intelligence Thérapeutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .message-bubble { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .prose pre { background-color: #f1f5f9; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .dark .prose pre { background-color: #1e293b; }
        .chat-title-pulse { animation: titlePulse 0.5s ease-out; }
        @keyframes titlePulse { 0% { background-color: rgba(14, 165, 233, 0.2); } 100% { background-color: transparent; } }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { ithelice: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' } } } }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen overflow-hidden flex transition-colors duration-300">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 transform -translate-x-full md:relative md:translate-x-0 sidebar-transition flex flex-col shadow-xl md:shadow-none">
        <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-dna text-ithelice-600 text-xl"></i>
                <span class="font-bold text-lg tracking-tight">ITHÉLICE <span class="text-xs font-normal text-gray-500 dark:text-gray-400">v1.1</span></span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-gray-700 dark:hover:text-gray-300"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="p-3">
            <button onclick="createNewChat()" class="w-full flex items-center justify-center gap-2 bg-ithelice-600 hover:bg-ithelice-700 text-white py-2.5 px-4 rounded-lg transition-colors font-medium text-sm">
                <i class="fa-solid fa-plus"></i> Nouvelle conversation
            </button>
        </div>
        <div class="flex-1 overflow-y-auto custom-scrollbar px-3 pb-3" id="chatHistoryList"></div>
        <div class="p-4 border-t border-gray-200 dark:border-gray-700 space-y-2">
            <button onclick="toggleSettings()" class="w-full flex items-center gap-3 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 p-2 rounded-lg transition-colors">
                <i class="fa-solid fa-gear"></i> Paramètres
            </button>
            <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 p-2 rounded-lg transition-colors">
                <i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:block"></i>
                <span class="dark:hidden">Mode sombre</span><span class="hidden dark:block">Mode clair</span>
            </button>
        </div>
    </aside>

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden backdrop-blur-sm"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative">
        <header class="h-16 border-b border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md flex items-center justify-between px-4 sticky top-0 z-30">
            <div class="flex items-center gap-3 min-w-0 flex-1">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-600 dark:text-gray-300 hover:text-ithelice-600 flex-shrink-0"><i class="fa-solid fa-bars text-xl"></i></button>
                <div class="min-w-0 flex-1">
                    <h1 class="font-semibold text-gray-800 dark:text-gray-100 truncate" id="headerTitle">ITHÉLICE</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 hidden sm:block truncate" id="headerSubtitle">Intelligence Thérapeutique de l'Hélice Cérébrale et de la Menace Dissoute</p>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 text-xs font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> IA Connectée
                </span>
            </div>
        </header>

        <div id="chatContainer" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-6 scroll-smooth"></div>

        <div class="border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-4">
            <div class="max-w-3xl mx-auto relative">
                <textarea id="messageInput" rows="1" placeholder="Posez votre question..." 
                    class="w-full bg-gray-100 dark:bg-gray-700 border-0 rounded-xl px-4 py-3 pr-12 resize-none focus:ring-2 focus:ring-ithelice-500 focus:bg-white dark:focus:bg-gray-600 transition-all custom-scrollbar text-sm md:text-base"
                    onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <button onclick="sendMessage()" id="sendBtn" class="absolute right-2 bottom-2 p-2 bg-ithelice-600 hover:bg-ithelice-700 text-white rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
            <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-2">
                ITHÉLICE est un modèle expérimental. Les informations sont fournies à titre éducatif.
            </p>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="toggleSettings()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-6 border border-gray-200 dark:border-gray-700 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 class="text-lg font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-gear text-ithelice-600"></i> Paramètres</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Modèle IA</label>
                    <select id="aiModel" class="w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm p-2.5 focus:ring-ithelice-500 focus:border-ithelice-500">
                        <option value="openai">OpenAI GPT (recommandé)</option>
                        <option value="mistral">Mistral</option>
                        <option value="llama">Llama</option>
                        <option value="qwen-coder">Qwen Coder</option>
                    </select>
                    <p class="text-xs text-gray-500 mt-1">Via Pollinations.ai — gratuit, illimité, sans clé API.</p>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="toggleSettings()" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Fermer</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-sm bg-ithelice-600 hover:bg-ithelice-700 text-white rounded-lg transition-colors">Sauvegarder</button>
            </div>
        </div>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let chats = JSON.parse(localStorage.getItem('ithelice_chats')) || [];
        let currentChatId = localStorage.getItem('ithelice_current_chat') || null;
        let isSidebarOpen = false;
        let settings = JSON.parse(localStorage.getItem('ithelice_settings')) || { model: 'openai' };

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            if (chats.length === 0) createNewChat();
            else if (!currentChatId || !chats.find(c => c.id === currentChatId)) currentChatId = chats[0].id;
            
            renderSidebar();
            renderChat();
            applyDarkMode();
            document.getElementById('aiModel').value = settings.model;
        });

        // --- SIDEBAR & NAVIGATION ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function createNewChat() {
            const newChat = { 
                id: Date.now().toString(), 
                title: 'Nouvelle conversation', 
                messages: [], 
                createdAt: new Date().toISOString() 
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveData();
            renderSidebar();
            renderChat();
            updateHeader();
            
            // Focus automatique sur l'input pour indiquer visuellement le changement
            setTimeout(() => {
                document.getElementById('messageInput').focus();
            }, 100);
            
            if (window.innerWidth < 768) toggleSidebar();
        }

        function switchChat(id) {
            if (currentChatId === id) return; // Déjà sur cette conversation
            currentChatId = id;
            saveData();
            renderSidebar();
            renderChat();
            updateHeader();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if (!confirm('Supprimer cette conversation ?')) return;
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) {
                currentChatId = chats.length > 0 ? chats[0].id : null;
                if (!currentChatId) createNewChat();
                else {
                    renderChat();
                    updateHeader();
                }
            }
            saveData();
            renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = chats.map(chat => `
                <div onclick="switchChat('${chat.id}')" class="group flex items-center justify-between p-3 rounded-lg cursor-pointer transition-colors mb-1 ${currentChatId === chat.id ? 'bg-ithelice-50 dark:bg-ithelice-900/20 border border-ithelice-200 dark:border-ithelice-800' : 'hover:bg-gray-100 dark:hover:bg-gray-700 border border-transparent'}">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate text-gray-800 dark:text-gray-200">${escapeHtml(chat.title)}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${new Date(chat.createdAt).toLocaleDateString()} ${chat.messages.length === 0 ? '• <span class="text-ithelice-600 dark:text-ithelice-400">Vide</span>' : `• ${chat.messages.length} msg`}</p>
                    </div>
                    <button onclick="deleteChat('${chat.id}', event)" class="opacity-0 group-hover:opacity-100 p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded transition-all ml-2 flex-shrink-0">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        // --- HEADER UPDATE (pour voir sur quelle conversation on est) ---
        function updateHeader() {
            const chat = chats.find(c => c.id === currentChatId);
            const headerTitle = document.getElementById('headerTitle');
            const headerSubtitle = document.getElementById('headerSubtitle');
            
            if (!chat) {
                headerTitle.textContent = 'ITHÉLICE';
                headerSubtitle.textContent = 'Intelligence Thérapeutique de l\'Hélice Cérébrale et de la Menace Dissoute';
                return;
            }
            
            headerTitle.textContent = chat.title;
            headerTitle.classList.add('chat-title-pulse');
            setTimeout(() => headerTitle.classList.remove('chat-title-pulse'), 500);
            
            if (chat.messages.length === 0) {
                headerSubtitle.innerHTML = '<span class="text-ithelice-600 dark:text-ithelice-400 font-medium">Nouvelle conversation — prête à démarrer</span>';
            } else {
                headerSubtitle.textContent = `${chat.messages.length} message${chat.messages.length > 1 ? 's' : ''} • Dernière activité : ${new Date(chat.createdAt).toLocaleString()}`;
            }
        }

        // --- CHAT RENDERING ---
        function renderChat() {
            const container = document.getElementById('chatContainer');
            const chat = chats.find(c => c.id === currentChatId);
            
            if (!chat || chat.messages.length === 0) {
                // Empty state généré dynamiquement (plus de bug d'IDs dupliqués)
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center text-gray-500 dark:text-gray-400 space-y-4">
                        <div class="w-16 h-16 rounded-2xl bg-ithelice-100 dark:bg-ithelice-900/30 flex items-center justify-center">
                            <i class="fa-solid fa-brain text-ithelice-600 text-2xl"></i>
                        </div>
                        <div class="max-w-md">
                            <h3 class="font-semibold text-gray-700 dark:text-gray-200 mb-1">
                                ${chat && chat.title === 'Nouvelle conversation' ? 'Nouvelle conversation prête' : 'Bienvenue dans ITHÉLICE v1.1'}
                            </h3>
                            <p class="text-sm">
                                ${chat && chat.title === 'Nouvelle conversation' 
                                    ? 'Commencez à écrire ci-dessous pour démarrer la conversation avec ITHÉLICE.' 
                                    : 'Connectée à une vraie IA (gratuite, illimitée, sans clé). Posez n\'importe quelle question : phobies, anxiété, traitements, biologie... L\'IA appliquera les principes TMD, ARI et IOB à votre situation.'}
                            </p>
                            <p class="text-xs mt-3 text-red-500 dark:text-red-400 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Ne remplace pas un avis médical ou psychiatrique.</p>
                        </div>
                    </div>`;
                updateHeader();
                return;
            }

            container.innerHTML = chat.messages.map((msg, index) => {
                if (msg.role === 'user') {
                    return `
                    <div class="flex justify-end message-bubble">
                        <div class="max-w-[85%] md:max-w-[70%] bg-ithelice-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 shadow-sm relative group">
                            <div id="user-text-${index}" class="text-sm md:text-base whitespace-pre-wrap">${escapeHtml(msg.content)}</div>
                            <div id="user-edit-${index}" class="hidden">
                                <textarea class="w-full bg-ithelice-700 text-white rounded p-2 text-sm mb-2" rows="3" id="user-input-${index}">${escapeHtml(msg.content)}</textarea>
                                <div class="flex gap-2 justify-end">
                                    <button onclick="cancelEdit(${index})" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1 rounded">Annuler</button>
                                    <button onclick="saveEdit(${index})" class="text-xs bg-white text-ithelice-700 font-medium px-3 py-1 rounded">Sauvegarder et régénérer</button>
                                </div>
                            </div>
                            <div class="flex justify-end gap-2 mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="toggleEdit(${index})" class="text-xs bg-white/20 hover:bg-white/30 px-2 py-1 rounded flex items-center gap-1"><i class="fa-solid fa-pen"></i> Modifier</button>
                            </div>
                        </div>
                    </div>`;
                } else {
                    return `
                    <div class="flex justify-start message-bubble">
                        <div class="max-w-[85%] md:max-w-[70%] bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm relative group">
                            <div class="flex items-center gap-2 mb-2 pb-2 border-b border-gray-100 dark:border-gray-700">
                                <i class="fa-solid fa-robot text-ithelice-600 text-xs"></i>
                                <span class="text-xs font-semibold text-ithelice-700 dark:text-ithelice-400">ITHÉLICE</span>
                                ${msg.responseTime ? `<span class="text-xs text-gray-400 ml-auto"><i class="fa-regular fa-clock mr-1"></i>${msg.responseTime}s</span>` : ''}
                            </div>
                            <div class="prose prose-sm dark:prose-invert max-w-none text-gray-800 dark:text-gray-200">
                                ${marked.parse(msg.content)}
                            </div>
                            <div class="flex gap-2 mt-3 pt-2 border-t border-gray-100 dark:border-gray-700 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="copyResponse(this, \`${btoa(unescape(encodeURIComponent(msg.content)))}\`)" class="text-xs text-gray-500 hover:text-ithelice-600 dark:hover:text-ithelice-400 flex items-center gap-1 px-2 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                                    <i class="fa-regular fa-copy"></i> Copier
                                </button>
                                <button onclick="retryResponse(${index})" class="text-xs text-gray-500 hover:text-ithelice-600 dark:hover:text-ithelice-400 flex items-center gap-1 px-2 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                                    <i class="fa-solid fa-rotate-right"></i> Réessayer
                                </button>
                            </div>
                        </div>
                    </div>`;
                }
            }).join('');
            scrollToBottom();
            updateHeader();
        }

        // --- MESSAGE ACTIONS ---
        function toggleEdit(index) {
            document.getElementById(`user-text-${index}`).classList.add('hidden');
            document.getElementById(`user-edit-${index}`).classList.remove('hidden');
            document.getElementById(`user-input-${index}`).focus();
        }

        function cancelEdit(index) {
            document.getElementById(`user-text-${index}`).classList.remove('hidden');
            document.getElementById(`user-edit-${index}`).classList.add('hidden');
        }

        function saveEdit(index) {
            const newContent = document.getElementById(`user-input-${index}`).value.trim();
            if (!newContent) return;
            const chat = chats.find(c => c.id === currentChatId);
            chat.messages[index].content = newContent;
            chat.messages = chat.messages.slice(0, index + 1);
            saveData();
            renderChat();
            generateAIResponse();
        }

        function retryResponse(index) {
            const chat = chats.find(c => c.id === currentChatId);
            chat.messages.splice(index, 1);
            saveData();
            renderChat();
            generateAIResponse();
        }

        function copyResponse(btn, base64Content) {
            const text = decodeURIComponent(escape(atob(base64Content)));
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Copié !';
                setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
            });
        }

        // --- SEND & GENERATE LOGIC ---
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;

            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            if (chat.messages.length === 0) {
                chat.title = content.substring(0, 40) + (content.length > 40 ? '...' : '');
                renderSidebar(); // Mettre à jour la sidebar immédiatement avec le nouveau titre
            }
            
            chat.messages.push({ role: 'user', content: content });
            input.value = '';
            input.style.height = 'auto';
            saveData();
            renderChat();
            generateAIResponse();
        }

        async function generateAIResponse() {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            const container = document.getElementById('chatContainer');
            const typingId = 'typing-' + Date.now();
            
            container.innerHTML += `
                <div id="${typingId}" class="flex justify-start message-bubble">
                    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm">
                        <div class="flex space-x-1.5">
                            <div class="w-2 h-2 bg-ithelice-500 rounded-full typing-dot"></div>
                            <div class="w-2 h-2 bg-ithelice-500 rounded-full typing-dot"></div>
                            <div class="w-2 h-2 bg-ithelice-500 rounded-full typing-dot"></div>
                        </div>
                    </div>
                </div>`;
            scrollToBottom();

            const startTime = performance.now();
            let responseText = '';
            let responseTime = 0;

            try {
                responseText = await fetchPollinationsResponse(chat.messages);
                const endTime = performance.now();
                responseTime = ((endTime - startTime) / 1000).toFixed(2);
            } catch (error) {
                responseText = `**Erreur de connexion à l'IA**\n\n${error.message}\n\n*Vérifiez votre connexion internet. Si le problème persiste, Pollinations.ai est peut-être temporairement indisponible.*`;
                responseTime = '0.00';
            }

            const typingEl = document.getElementById(typingId);
            if (typingEl) typingEl.remove();
            
            chat.messages.push({ role: 'assistant', content: responseText, responseTime: responseTime });
            saveData();
            renderChat();
        }

        // --- POLLINATIONS.AI API ---
        async function fetchPollinationsResponse(messages) {
            const systemPrompt = `Tu es ITHÉLICE v1.1 (Intelligence Thérapeutique de l'Hélice Cérébrale et de la Menace Dissoute).

Tu es une architecture expérimentale de raisonnement thérapeutique orientée vers la réduction de la souffrance évitable.

**Tes principes directeurs à appliquer systématiquement :**

1. **TMD (Thérapie de la Menace Dissoute)** :
   - Accueillir et clarifier le ressenti sans jugement
   - Nommer la souffrance pour créer une distance cognitive
   - Identifier la menace corporelle ou psychologique sous-jacente
   - Vérifier si cette menace est réelle, anticipée, ou obsolète
   - Proposer des moyens adaptés pour réduire la contribution de cette menace à la souffrance

2. **Théorie de l'Hélice Cérébrale** :
   - Modèle conceptuel représentant la dynamique de traitement de l'information par le cerveau
   - Examiner les facteurs susceptibles de modifier cette dynamique (molécules, BHE, concentration, métabolisme)
   - Comprendre les décalages entre l'état interne et les exigences de la situation
   - Ne pas présenter cela comme une vérité anatomique établie, mais comme une hypothèse de travail

3. **Substrat biologique** :
   - Examiner les conditions matérielles, énergétiques et cellulaires (protons, exosomes, conversion d'énergie mitochondriale)
   - Considérer l'impact du sommeil, de la nutrition, et de l'état physiologique
   - Rester prudent sur les conclusions hâtives concernant la supplémentation

4. **Contrôles ARI (Auto-Révision Itérative)** :
   - Distinguer clairement : Observation (faits) / Hypothèse (explication possible) / Interprétation (cadre théorique) / Conclusion (soutenue par les éléments)
   - Proportionner le degré de certitude aux éléments disponibles
   - Expliciter les conditions qui pourraient faire réviser chaque hypothèse

        }

        function applyDarkMode() {

                          (!localStorage.getItem('ithelice_dark_mode') && window.matchMedia('(prefers-color-scheme: dark)').matches);
